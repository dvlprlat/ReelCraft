name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup OpenCV vision venv
        run: |
          python3 -m venv .venv-vision
          .venv-vision/bin/pip install --quiet opencv-python-headless numpy

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit & pipeline tests
        run: npm test
